<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Driver Profit</title>
<meta name="theme-color" content="#0B4F8A">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Driver Profit">

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface2:#E2E7EC; --ink:#15202B; --muted:#5A6672; --line:#D2D9E0;
  --hero:#0B4F8A; --hero-ink:#FFFFFF; --hero-muted:#BFD4E8;
  --amber:#F2A900; --amber-ink:#241A00; --gain:#1C7548; --cost:#B03A25; --warn-bg:#FFF3D1; --warn-ink:#6B4A00;
  --focus:#0B4F8A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111922; --surface:#1A2430; --surface2:#25313E; --ink:#E6EBF0; --muted:#98A5B2; --line:#2D3A48;
    --hero:#123F68; --hero-ink:#FFFFFF; --hero-muted:#A9C3DC;
    --amber:#F2B321; --amber-ink:#221800; --gain:#4BC08A; --cost:#F0806A; --warn-bg:#3A2F12; --warn-ink:#F1CF7A;
    --focus:#7DB3E6;
  }
}
:root[data-theme="dark"]{
  --bg:#111922; --surface:#1A2430; --surface2:#25313E; --ink:#E6EBF0; --muted:#98A5B2; --line:#2D3A48;
  --hero:#123F68; --hero-ink:#FFFFFF; --hero-muted:#A9C3DC;
  --amber:#F2B321; --amber-ink:#221800; --gain:#4BC08A; --cost:#F0806A; --warn-bg:#3A2F12; --warn-ink:#F1CF7A;
  --focus:#7DB3E6;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;
  -webkit-tap-highlight-color:transparent}
.num{font-family:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;font-variant-numeric:tabular-nums}
main{max-width:520px;margin:0 auto;padding:14px 14px calc(92px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;font-weight:600}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.top{display:flex;justify-content:space-between;align-items:baseline;margin:4px 2px 12px}
.top h1{font-size:1.05rem;font-weight:600}
.top .date{color:var(--muted);font-size:.95rem}
.sync{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gain)}
.dot.pending{background:var(--amber)} .dot.local{background:var(--muted)}

.hero{background:var(--hero);color:var(--hero-ink);border-radius:16px;padding:16px 18px 18px}
.hero .state{font-size:.95rem;color:var(--hero-muted)}
.hero .big{font-size:4.4rem;line-height:1;font-weight:700;margin-top:8px;letter-spacing:-.01em}
.hero .big small{font-size:1.4rem;font-weight:600;margin-left:6px}
.hero .cap{color:var(--hero-muted);font-size:.95rem;margin-top:2px}
.hero .pair{display:flex;gap:22px;margin-top:14px;flex-wrap:wrap}
.hero .pair b{display:block;font-size:1.7rem;font-weight:600;line-height:1.1}
.hero .pair span{color:var(--hero-muted);font-size:.85rem}
.hero .paused{display:inline-block;margin-top:10px;background:var(--amber);color:var(--amber-ink);border-radius:8px;padding:3px 10px;font-weight:600}

.figs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:14px;overflow:hidden;margin-top:12px}
.figs div{background:var(--surface);padding:10px 12px}
.figs span{display:block;color:var(--muted);font-size:.85rem}
.figs b{font-size:1.35rem;font-weight:600}
.figs em{font-style:normal;color:var(--muted);font-size:.8rem;margin-left:4px}
.note{color:var(--muted);font-size:.88rem;margin:8px 2px 0}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{border:0;border-radius:14px;padding:14px 12px;min-height:56px;font-size:1.05rem;font-weight:600;cursor:pointer;
  background:var(--surface);color:var(--ink);border:1px solid var(--line);text-align:center}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--amber);color:var(--amber-ink);border-color:transparent}
.btn.big{grid-column:1/-1;min-height:68px;font-size:1.2rem;width:100%}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;color:var(--cost);border-color:var(--line)}
.btn.small{min-height:40px;padding:8px 12px;font-size:.95rem;border-radius:10px}
.btn[disabled]{opacity:.45}
.btn.danger.armed{background:var(--cost);color:#fff;border-color:var(--cost)}
.full{width:100%}

.sec{margin-top:22px}
.sec h2{font-size:1rem;font-weight:600;margin:0 2px 8px;color:var(--muted)}
.list{background:var(--surface);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.item:first-child{border-top:0}
.item .l{min-width:0}
.item .l b{font-weight:600;display:block}
.item .l span{color:var(--muted);font-size:.88rem}
.item .r{text-align:right;white-space:nowrap}
.item .r b{display:block;font-size:1.15rem;font-weight:600}
.item .r span{color:var(--muted);font-size:.85rem}
.empty{padding:16px 14px;color:var(--muted)}
.weekhead{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 6px}
.weekhead b{font-weight:600}
button.weekhead{width:100%;background:none;border:0;padding:6px 2px;cursor:pointer;text-align:left;font:inherit;color:inherit;gap:10px}
svg .ax{font-size:10px;fill:var(--muted);font-family:"Barlow Condensed",sans-serif}
.rep td .btn.small{min-height:34px;padding:4px 10px;font-size:.9rem}
.weekhead span{color:var(--muted);font-size:.88rem;text-align:right}
.tag{display:inline-block;font-size:.78rem;padding:1px 7px;border-radius:6px;background:var(--surface2);color:var(--muted);margin-left:6px;vertical-align:2px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:14px 4px 12px;font-size:.95rem;color:var(--muted);cursor:pointer;font-weight:500}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--amber)}

#sheet[hidden]{display:none}
#sheet{position:fixed;inset:0;z-index:20}
.scrim{position:absolute;inset:0;background:rgba(5,12,20,.45)}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--bg);border-radius:18px 18px 0 0;
  max-height:92%;overflow:auto;padding:0 16px calc(18px + env(safe-area-inset-bottom,0px))}
.ph{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:14px 0 10px;z-index:1}
.ph h2{font-size:1.2rem}
.x{background:var(--surface2);border:0;border-radius:50%;width:38px;height:38px;font-size:1rem;cursor:pointer}
.fld{display:block;margin:12px 0}
.fld>span{display:block;font-size:.9rem;color:var(--muted);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;font:inherit;font-size:1.15rem;padding:12px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);min-height:52px}
.fld textarea{min-height:80px;font-size:1rem}
.fld input.amt{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:1.6rem;font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .fld{margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-size:.98rem;cursor:pointer;min-height:42px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.line{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0}
.line .fld{margin:8px 0 4px}
.line .rm{float:right;background:none;border:0;color:var(--cost);cursor:pointer;padding:4px}
.hint{color:var(--muted);font-size:.9rem;margin:6px 0}
.calc{font-size:1.05rem;margin:10px 0;min-height:1.4em}
.warnbox{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:10px 12px;margin:10px 0}
.err{color:var(--cost);font-weight:600;min-height:1.2em;margin:6px 0}
.stack>*+*{margin-top:10px}
.rep{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.rep .rh{font-size:1.25rem;font-weight:700}
.rep .rs{color:var(--muted)}
.rep table{width:100%;border-collapse:collapse;margin-top:10px}
.rep td{padding:5px 0;vertical-align:top}
.rep td:last-child{text-align:right;white-space:nowrap}
.rep tr.tot td{border-top:1px solid var(--line);padding-top:8px;font-weight:700}
.rep tr.sub td{color:var(--muted);font-size:.88rem;padding-top:0}
.rep .final{display:flex;gap:18px;margin-top:12px}
.rep .final b{display:block;font-size:2rem;font-weight:700;line-height:1.1}
.rep .final span{color:var(--muted);font-size:.85rem}
.pos{color:var(--gain)} .neg{color:var(--cost)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.toast.undo{display:flex;align-items:center;gap:14px;pointer-events:auto;white-space:nowrap}
.toast.undo button{background:none;border:0;color:var(--amber);font:inherit;font-weight:700;padding:6px 2px;cursor:pointer;text-decoration:underline}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}
.goal .gt{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.goal .gt b{font-size:1.5rem;font-weight:700}
.goal .gt span{color:var(--muted);font-size:.9rem}
.bar{height:12px;border-radius:6px;background:var(--surface2);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--amber);border-radius:6px}
.bar.done i{background:var(--gain)}
.goal p{margin:0;color:var(--muted);font-size:.9rem}
.goal button{background:none;border:0;padding:0;color:var(--focus);font-weight:600;cursor:pointer;font-size:.9rem}
.rc img{display:block;width:100%;max-height:220px;object-fit:contain;border-radius:12px;background:var(--surface2);margin:8px 0;cursor:zoom-in}
.rc img.open{max-height:none;cursor:zoom-out}
.rcbtn{display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.rcbtn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.rcmsg:empty{display:none}
.rev h3{font-size:.95rem;font-weight:700;margin:12px 0 2px}
.rev ul{margin:0;padding-left:20px}
.rev li{margin:3px 0}
.rev .rvt{font-size:1.1rem;font-weight:600;margin:12px 0 0}
.toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
#auth{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding:calc(28px + env(safe-area-inset-top,0px)) 16px 32px}
#auth[hidden]{display:none}
#auth .box{max-width:420px;margin:0 auto}
#auth h1{font-size:1.6rem;font-weight:700;margin:6px 0 4px}
#auth .sub{color:var(--muted);margin:0 0 14px}
.linkbtn{background:none;border:0;padding:8px 0;color:var(--focus);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline}
.okbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" aria-label="Põhimenüü"><div class="in">
  <button data-tab="today">Täna</button>
  <button data-tab="history">Ajalugu</button>
  <button data-tab="car">Auto</button>
  <button data-tab="settings">Seaded</button>
</div></nav>
<div id="sheet" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="auth" hidden></div>

<script id="engine">
// ===== Driver Profit arvutusmootor (puhas loogika, ei puuduta DOM-i) =====
var NOW = null;
function now(){ return NOW != null ? NOW : Date.now(); }
var HOUR = 3600000, MIN = 60000;
var DEFAULT_SETTINGS = { fuelPerKm: 0.09, expectedHours: 60, monthGoal: 0, rentTerms: [{ from: "2026-01-01", weekly: 210, perKm: 0.06 }] };
var S = { workdays: {}, fuel: {}, expenses: {}, events: {}, reviews: {}, settings: null };
var memo = null;

function pad(n){ return String(n).padStart(2, "0"); }
function dateKey(ts){ var d = new Date(ts); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function addDays(ts, n){ var d = new Date(ts); d.setDate(d.getDate() + n); return d.getTime(); }
function mondayOf(ts){ var d = new Date(ts); d.setHours(0, 0, 0, 0); var k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return d.getTime(); }
function ov(a1, a2, b1, b2){ return Math.max(0, Math.min(a2, b2) - Math.max(a1, b1)); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

function settings(){
  var s = Object.assign({}, DEFAULT_SETTINGS, S.settings || {});
  if (!s.rentTerms || !s.rentTerms.length) s.rentTerms = DEFAULT_SETTINGS.rentTerms;
  return s;
}
function termsAt(ts){
  var key = dateKey(ts);
  var list = settings().rentTerms.slice().sort(function(a, b){ return a.from < b.from ? -1 : 1; });
  var t = list[0];
  list.forEach(function(x){ if (x.from <= key) t = x; });
  return t;
}
function workdaysSorted(){ return Object.values(S.workdays).sort(function(a, b){ return a.s - b.s; }); }
function activeWorkday(){
  var a = Object.values(S.workdays).filter(function(w){ return !w.e; }).sort(function(a, b){ return b.s - a.s; });
  return a[0] || null;
}
function wdEnd(w){ return w.e != null ? w.e : now(); }
function pauseOverlap(w, a, b){
  var t = 0;
  (w.pauses || []).forEach(function(p){ t += ov(p.s, p.e != null ? p.e : now(), a, b); });
  return t;
}
// Töötatud aeg (ms) tööpäeva sees, valikuliselt piiratud vahemikuga [a,b), pausid maha arvatud
function workedMs(w, a, b){
  if (a == null) a = -Infinity; if (b == null) b = Infinity;
  var s = w.s, e = wdEnd(w);
  var lo = Math.max(s, a), hi = Math.min(e, b);
  if (hi <= lo) return 0;
  return Math.max(0, (hi - lo) - pauseOverlap(w, lo, hi));
}
function periodHours(w, p){ return Math.max(0, (p.e - p.s) - pauseOverlap(w, p.s, p.e)) / HOUR; }
function periodIncome(p){ return (p.lines || []).reduce(function(a, l){ return a + (+l.amt || 0); }, 0); }
function dayIncome(w){ return (w.periods || []).reduce(function(a, p){ return a + periodIncome(p); }, 0); }
function incomeBySource(w){
  var m = {};
  (w.periods || []).forEach(function(p){ (p.lines || []).forEach(function(l){ m[l.src] = (m[l.src] || 0) + (+l.amt || 0); }); });
  return m;
}
function weekHours(m){
  var e = addDays(m, 7);
  return workdaysSorted().reduce(function(a, w){ return a + workedMs(w, m, e); }, 0) / HOUR;
}
function expectedHours(){
  if (memo && memo.expH != null) return memo.expH;
  var m0 = mondayOf(now()), hs = [];
  for (var i = 1; i <= 4; i++){ var h = weekHours(addDays(m0, -7 * i)); if (h > 0) hs.push(h); }
  var r = hs.length ? hs.reduce(function(a, b){ return a + b; }, 0) / hs.length : settings().expectedHours;
  if (memo) memo.expH = r;
  return r;
}
// Fikseeritud rendi tunnimäär nädalale, mis algab esmaspäeval m
function weekRate(m){
  var key = "r" + m;
  if (memo && memo[key]) return memo[key];
  var final = now() >= addDays(m, 7);
  var weekly = termsAt(m).weekly;
  var hours = final ? weekHours(m) : expectedHours();
  var res = { rate: hours > 0 ? weekly / hours : 0, final: final, hours: hours };
  if (memo) memo[key] = res;
  return res;
}
function fixedRentFor(w){
  var amt = 0, final = true;
  var m = mondayOf(w.s), last = mondayOf(wdEnd(w));
  while (m <= last){
    var r = weekRate(m);
    amt += r.rate * workedMs(w, m, addDays(m, 7)) / HOUR;
    if (!r.final) final = false;
    m = addDays(m, 7);
  }
  return { amt: amt, final: final };
}
function knownOdos(w){
  var s = w.s, e = wdEnd(w), pts = [];
  Object.values(S.fuel).forEach(function(f){ if (f.odo != null && f.t >= s && f.t <= e) pts.push({ t: f.t, odo: +f.odo }); });
  (w.periods || []).forEach(function(p){ if (p.odo != null) pts.push({ t: p.e, odo: +p.odo }); });
  return pts.sort(function(a, b){ return a.t - b.t; });
}
function avgKmh(){
  if (memo && memo.kmh !== undefined) return memo.kmh;
  var from = now() - 28 * 24 * HOUR, km = 0, h = 0;
  workdaysSorted().forEach(function(w){
    if (w.e && w.oe != null && w.os != null && w.s >= from){ km += Math.max(0, w.oe - w.os); h += workedMs(w) / HOUR; }
  });
  var r = h > 1 ? km / h : null;
  if (memo) memo.kmh = r;
  return r;
}
// Päeva km: lõpetatud päeval täpne, käimasoleval viimane teadaolev näit + hinnang
function dayKm(w){
  if (w.os == null) return { km: null, est: false };
  if (w.e && w.oe != null) return { km: Math.max(0, w.oe - w.os), est: false };
  var pts = knownOdos(w).filter(function(p){ return p.odo >= w.os; });
  var km = 0, lastT = w.s, est = false;
  if (pts.length){ var last = pts[pts.length - 1]; km = last.odo - w.os; lastT = last.t; }
  var remH = workedMs(w, lastT, now()) / HOUR;
  if (remH > 0.05){
    var a = avgKmh();
    if (a != null){ km += a * remH; est = true; }
    else if (!pts.length) return { km: null, est: false };
    else est = true;
  }
  return { km: km, est: est };
}
function expenseMap(){
  if (memo && memo.exp) return memo.exp;
  var map = {}, wds = workdaysSorted();
  Object.values(S.expenses).forEach(function(x){
    var w = wds.find(function(w){ return x.t >= w.s && x.t <= wdEnd(w); });
    if (!w){ var k = dateKey(x.t); w = wds.find(function(w){ return dateKey(w.s) === k; }); }
    if (w){ (map[w.id] = map[w.id] || []).push(x); }
  });
  if (memo) memo.exp = map;
  return map;
}
// Täispaak→täispaak: tegelik kütusekulu lõikude kaupa (ainult liitrites mõõdetud kütus)
function fuelSegments(){
  if (memo && memo.segs) return memo.segs;
  var fs = Object.values(S.fuel).filter(function(f){ return f.odo != null && +f.l > 0; }).sort(function(a, b){ return a.odo - b.odo || a.t - b.t; });
  var segs = [], start = null, l = 0, cost = 0, ok = true;
  fs.forEach(function(f){
    var isKg = (f.ft || "Bensiin") === "CNG";
    if (start){ l += +f.l; cost += +f.sum || 0; if (isKg) ok = false; }
    if (f.full){
      if (start && ok && f.odo > start.odo){
        var km = f.odo - start.odo, lp = l / km * 100;
        if (km >= 50 && lp >= 2 && lp <= 30) segs.push({ fromT: start.t, toT: f.t, fromOdo: start.odo, toOdo: f.odo, km: km, l: l, cost: cost, lp100: lp, ekm: cost / km });
      }
      start = f; l = 0; cost = 0; ok = !isKg;
    }
  });
  if (memo) memo.segs = segs;
  return segs;
}
function recentFuel(){

function chartsCard(){
  var cur = mondayOf(now()), weeks = [];
  for (var i = 7; i >= 0; i--){
    var m = addDays(cur, -7 * i), r = rangeDetail(m, addDays(m, 7));
    weeks.push({ m: m, inc: r.inc, costs: r.costs, netH: r.netH, days: r.days });
  }
  var used = weeks.filter(function(w){ return w.days; });
  if (used.length < 2) return '<div class="sec"><h2>Graafikud</h2><div class="list"><div class="empty">Graafikud ilmuvad, kui sul on vähemalt kahe nädala andmed.</div></div></div>';
  var W = 340, H = 150, padL = 36, padB = 22, padT = 10, cw = (W - padL - 6) / weeks.length;
  var maxE = Math.max.apply(null, weeks.map(function(w){ return Math.max(w.inc, w.costs); })) || 1;
  var ys = function(v){ return padT + (H - padT - padB) * (1 - v / maxE); };
  var bars = weeks.map(function(w, i){
    var x = padL + i * cw, bw = cw * 0.36;
    var lab = '<text x="' + (x + cw / 2) + '" y="' + (H - 6) + '" text-anchor="middle" class="ax">' + new Date(w.m).getDate() + "." + (new Date(w.m).getMonth() + 1) + '</text>';
    if (!w.days) return lab;
    return '<rect x="' + (x + cw * 0.12) + '" y="' + ys(w.inc) + '" width="' + bw + '" height="' + (ys(0) - ys(w.inc)) + '" rx="2" fill="var(--hero)"><title>Tulu ' + eur(w.inc) + '</title></rect>' +
      '<rect x="' + (x + cw * 0.52) + '" y="' + ys(w.costs) + '" width="' + bw + '" height="' + (ys(0) - ys(w.costs)) + '" rx="2" fill="var(--cost)"><title>Kulud ' + eur(w.costs) + '</title></rect>' + lab;
  }).join("");
  var axis = '<line x1="' + padL + '" x2="' + W + '" y1="' + ys(0) + '" y2="' + ys(0) + '" stroke="var(--line)"/>' +
    '<text x="' + (padL - 4) + '" y="' + (ys(maxE) + 4) + '" text-anchor="end" class="ax">' + nf0.format(maxE) + '</text><text x="' + (padL - 4) + '" y="' + (ys(0)) + '" text-anchor="end" class="ax">0</text>';

  var vals = rates.filter(function(v){ return v != null; });
  var lo = Math.min(0, Math.min.apply(null, vals)), hi = Math.max.apply(null, vals) || 1;
  var yr = function(v){ return padT + (H - padT - padB) * (1 - (v - lo) / (hi - lo || 1)); };
  var pts = [], dots = "";
  rates.forEach(function(v, i){ if (v == null) return; var x = padL + i * cw + cw / 2; pts.push(x + "," + yr(v)); dots += '<circle cx="' + x + '" cy="' + yr(v) + '" r="3.5" fill="var(--amber)"><title>' + perH(v) + '</title></circle><text x="' + x + '" y="' + (yr(v) - 8) + '" text-anchor="middle" class="ax">' + nf0.format(v) + '</text>'; });
  var labs = weeks.map(function(w, i){ return '<text x="' + (padL + i * cw + cw / 2) + '" y="' + (H - 6) + '" text-anchor="middle" class="ax">' + new Date(w.m).getDate() + "." + (new Date(w.m).getMonth() + 1) + '</text>'; }).join("");
  var zero = lo < 0 ? '<line x1="' + padL + '" x2="' + W + '" y1="' + yr(0) + '" y2="' + yr(0) + '" stroke="var(--line)" stroke-dasharray="3 3"/>' : "";
  return '<div class="sec"><h2>Graafikud, viimased 8 nädalat</h2><section class="rep">' +
    '<div class="rh" style="font-size:1rem">Tulu ja kulud nädalas (€)</div>' +
    '<div class="rs" style="font-size:.85rem"><span style="color:var(--hero)">■</span> tulu &nbsp; <span style="color:var(--cost)">■</span> otsesed kulud</div>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Nädala tulu ja kulud">' + axis + bars + '</svg>' +
    '<div class="rh" style="font-size:1rem;margin-top:14px">Tegelik €/h nädalas</div>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Tegelik tunnitasu nädalas">' + zero +
    (pts.length > 1 ? '<polyline points="' + pts.join(" ") + '" fill="none" stroke="var(--amber)" stroke-width="2.5"/>' : "") + dots + labs + '</svg>' +
    '<p class="hint">Nädala alguse kuupäev all. Pooleli oleva nädala numbrid on esialgsed.</p></section></div>';

function sheetIncome(w, pid, pre){

  var s, e, lines, odo = "";

  else {
    e = now();
    var cands = [w.s].concat((w.periods || []).map(function(p){ return p.e; }), (w.pauses || []).filter(function(p){ return p.e; }).map(function(p){ return p.e; }));
    s = Math.max.apply(null, cands.filter(function(x){ return x <= e; }));
    lines = pre && pre.lines ? pre.lines.map(function(l){ return { src: l.src, amt: String(l.amt) }; }) : [{ src: lastSrc(), amt: "" }];
    if (pre && pre.odo != null) odo = pre.odo;
  }
  function linesHtml(){
    return lines.map(function(l, i){
      return '<div class="line" data-i="' + i + '">' + (i > 0 ? '<button type="button" class="rm" data-rm="' + i + '">Eemalda</button>' : "") +
        chips("src" + i, SOURCES, l.src) +
        '<div class="row2" style="margin:6px 0 2px"><button type="button" class="btn small' + (l.mode !== "rate" ? " primary" : "") + '" data-mode="sum" data-mi="' + i + '">Summa €</button><button type="button" class="btn small' + (l.mode === "rate" ? " primary" : "") + '" data-mode="rate" data-mi="' + i + '">Tunnitasu €/h</button></div>' +
        (l.mode === "rate"
          ? '<label class="fld"><span>Tunnitasu (€/h)</span><input class="amt" data-amt="' + i + '" inputmode="decimal" autocomplete="off" value="' + (l.rate != null && l.rate !== "" ? String(l.rate).replace(".", ",") : "") + '"></label>'
          : '<label class="fld"><span>Summa (€)</span><input class="amt" data-amt="' + i + '" inputmode="decimal" autocomplete="off" value="' + (l.amt !== "" && l.amt != null ? String(l.amt).replace(".", ",") : "") + '"></label>') + '</div>';
    }).join("");
  }
  openSheet(editing ? "Muuda tuluperioodi" : "Lisa tulu",
    '<div class="row2"><label class="fld"><span>Algus</span><input type="time" id="f-s" value="' + hm(s) + '"></label><label class="fld"><span>Lõpp</span><input type="time" id="f-e" value="' + hm(e) + '"></label></div>' +
    '<div id="f-lines">' + linesHtml() + '</div>' +
    '<button type="button" class="btn ghost small" id="f-add">+ Teine allikas samas perioodis</button>' +
    '<label class="fld"><span>Odomeeter perioodi lõpus (valikuline)</span><input id="f-odo" inputmode="numeric" autocomplete="off" value="' + odo + '"></label>' +
    '<p class="calc num" id="f-calc"></p><div class="warnbox" id="f-warn" hidden></div><div class="err"></div>' +
    '<button class="btn primary big" id="f-save">Salvesta</button>' +
    (editing ? '<div style="margin-top:10px"><button class="btn danger full" id="f-del">Kustuta periood</button></div>' : ""),
    function(p){
      function readLines(){
        $$(".line", p).forEach(function(el){
          var i = +el.dataset.i;
          lines[i].src = chipVal($("[data-chips]", el)) || lines[i].src;
          if (lines[i].mode === "rate") lines[i].rate = $("[data-amt]", el).value; else lines[i].amt = $("[data-amt]", el).value;
        });
      }
      function lineAmt(l, hrs){
        if (l.mode === "rate"){ var r = parseNum(l.rate); return r != null && hrs > 0 ? Math.round(r * hrs * 100) / 100 : null; }
        return parseNum(l.amt);
      }
      function curHrs(){ var t = times(); return t ? periodHours(w, { s: t.s, e: t.e }) : 0; }
      function times(){
        var sv = $("#f-s", p).value, ev = $("#f-e", p).value;
        if (!sv || !ev) return null;
        var st = tsInWorkday(w, sv), et = tsInWorkday(w, ev);
        if (et <= st) et = addDays(et, 1);
        if (et - st > 20 * HOUR) return null;
        return { s: st, e: et };
      }
      function update(){
        readLines();
        var t = times(), hh = t ? periodHours(w, { s: t.s, e: t.e }) : 0, total = lines.reduce(function(a, l){ return a + (lineAmt(l, hh) || 0); }, 0);
        var c = $("#f-calc", p), wb = $("#f-warn", p), save = $("#f-save", p);
        if (!t){ c.textContent = "Kontrolli algus- ja lõpuaega."; wb.hidden = true; save.disabled = true; return; }
        var hrs = periodHours(w, { s: t.s, e: t.e });
        c.textContent = "Kestus " + dur(hrs * HOUR) + (total > 0 && hrs > 0 ? ", " + eur(total) + " → " + perH(total / hrs) : "");
        var clash = overlapsOther(w, t.s, t.e, editing && editing.id);
        if (clash.length){
          var mySrc = {}; lines.forEach(function(l){ mySrc[l.src] = 1; });
          var same = clash.filter(function(q){ return (q.lines || []).some(function(l){ return mySrc[l.src]; }); });
          var srcOf = function(q){ return (q.lines || []).map(function(l){ return l.src; }).filter(function(v, i, a){ return a.indexOf(v) === i; }).join(" + "); };
          wb.hidden = false;
          if (same.length){
            var c0 = same[0];
            wb.innerHTML = "Sama platvorm (" + esc(srcOf(c0)) + ") on juba sisestatud ajal " + hm(c0.s) + "–" + hm(c0.e) + ". Muuda aegu või ava see periood ja paranda seal.";
            save.disabled = true;
          } else {
            wb.innerHTML = "Kattub ajaga " + clash.map(function(q){ return hm(q.s) + "–" + hm(q.e) + " (" + esc(srcOf(q)) + ")"; }).join(", ") + ". See on korras, kui sõitsid mitme äpiga korraga: tööpäeva tunnid ei kahekordistu ja iga platvormi tunnitasu arvestatakse tema enda ajaga.";
            save.disabled = false;
          }
        } else { wb.hidden = true; save.disabled = false; }
      }
      function redrawLines(){ $("#f-lines", p).innerHTML = linesHtml(); wireChips($("#f-lines", p), update); }
      wireChips($("#f-lines", p), update);
      p.addEventListener("input", update);
      $("#f-lines", p).addEventListener("click", function(ev){
        var md = ev.target.closest("[data-mode]");
        if (md){
          readLines(); var L = lines[+md.dataset.mi], hh = curHrs();
          if (md.dataset.mode === "rate" && L.mode !== "rate"){ var a0 = parseNum(L.amt); L.rate = a0 != null && hh > 0 ? String(Math.round(a0 / hh * 100) / 100) : ""; L.mode = "rate"; }
          else if (md.dataset.mode === "sum" && L.mode === "rate"){ var a1 = lineAmt(L, hh); L.amt = a1 != null ? String(a1) : ""; L.mode = "sum"; L.rate = null; }
          redrawLines(); update(); var inp = $('[data-amt="' + md.dataset.mi + '"]', p); if (inp) inp.focus(); return;
        }
        var r = ev.target.closest("[data-rm]"); if (!r) return;
        readLines(); lines.splice(+r.dataset.rm, 1); redrawLines(); update();
      });
      $("#f-add", p).onclick = function(){
        readLines();
        var used = lines.map(function(l){ return l.src; });
        lines.push({ src: SOURCES.find(function(x){ return used.indexOf(x) < 0; }) || "Muu", amt: "" });
        redrawLines(); update();
        var ins = $$("[data-amt]", p); ins[ins.length - 1].focus();
      };
      $("#f-save", p).onclick = function(){
        readLines();
        var t = times(); if (!t){ setErr(p, "Kontrolli algus- ja lõpuaega."); return; }
        var hs = periodHours(w, { s: t.s, e: t.e });
        var ls = lines.map(function(l){ var o = { src: l.src, amt: lineAmt(l, hs) }; if (l.mode === "rate") o.rate = parseNum(l.rate); return o; }).filter(function(l){ return l.amt != null && l.amt > 0; });
        if (!ls.length){ setErr(p, "Sisesta summa või tunnitasu."); return; }
        var o = parseNum($("#f-odo", p).value);
        if (o != null && o < w.os){ setErr(p, "Odomeetri näit ei saa olla väiksem kui tööpäeva alguse näit (" + nf0.format(w.os) + " km)."); return; }
        var cur = activeWorkday();
        var nw = clone(S.workdays[w.id] || w);
        var per = { id: editing ? editing.id : uid8(), s: t.s, e: t.e, odo: o != null ? Math.round(o) : null, lines: ls };
        nw.periods = (nw.periods || []).filter(function(x){ return x.id !== per.id; }).concat([per]).sort(function(a, b){ return a.s - b.s; });
        lsSet("dp_lastsrc", ls[0].src);
        put("workdays", nw.id, nw); closeSheet(); toast(editing ? "Periood muudetud" : "Tulu salvestatud");
        if (editing && tab === "history") sheetReport(nw.id);
      };
      if (editing){
        confirmTap($("#f-del", p), "Kustutan perioodi?", function(){
          var old = clone(S.workdays[w.id]), nw = clone(S.workdays[w.id]); nw.periods = nw.periods.filter(function(x){ return x.id !== editing.id; });
          put("workdays", nw.id, nw); closeSheet();
          undoToast("Periood kustutatud", function(){ var cur = clone(S.workdays[old.id] || old), back = old.periods.filter(function(x){ return x.id === editing.id; })[0]; cur.periods = (cur.periods || []).filter(function(x){ return x.id !== editing.id; }).concat([back]).sort(function(a, b){ return a.s - b.s; }); put("workdays", cur.id, cur); });
          if (tab === "history") sheetReport(nw.id);
        });
      }
      if (pre){ if (pre.s) $("#f-s", p).value = pre.s; if (pre.e) $("#f-e", p).value = pre.e; }

      if (!editing && !pre){ var a = $("[data-amt]", p); a.focus(); }
    });

function sheetEditDay(wid){
  var w = clone(S.workdays[wid]);
  function pausesHtml(){
    return (w.pauses || []).map(function(x, i){
      return '<div class="line"><button type="button" class="rm" data-rmp="' + i + '">Eemalda</button><div class="row2"><label class="fld"><span>Paus algas</span><input type="datetime-local" data-ps="' + i + '" value="' + toDTL(x.s) + '"></label><label class="fld"><span>Paus lõppes</span><input type="datetime-local" data-pe="' + i + '" value="' + (x.e ? toDTL(x.e) : "") + '"></label></div></div>';
    }).join("");
  }
  openSheet("Muuda tööpäeva",
    '<label class="fld"><span>Algus</span><input type="datetime-local" id="f-s" value="' + toDTL(w.s) + '"></label>' +
    (w.e ? '<label class="fld"><span>Lõpp</span><input type="datetime-local" id="f-e" value="' + toDTL(w.e) + '"></label>' : "") +
    '<div class="row2"><label class="fld"><span>Alguse odomeeter</span><input id="f-os" inputmode="numeric" value="' + (w.os != null ? w.os : "") + '"></label>' +
    (w.e ? '<label class="fld"><span>Lõpu odomeeter</span><input id="f-oe" inputmode="numeric" value="' + (w.oe != null ? w.oe : "") + '"></label>' : "") + '</div>' +
    '<div class="sec" style="margin-top:12px"><h2>Pausid</h2><div id="f-pauses">' + pausesHtml() + '</div><button type="button" class="btn ghost small" id="f-addp">+ Lisa paus</button></div>' +
    '<div class="err"></div><button class="btn primary big" id="f-save">Salvesta</button>',
    function(p){
      function readP(){
        $$("[data-ps]", p).forEach(function(i){ w.pauses[+i.dataset.ps].s = fromDTL(i.value); });
        $$("[data-pe]", p).forEach(function(i){ w.pauses[+i.dataset.pe].e = fromDTL(i.value); });
      }
      $("#f-pauses", p).addEventListener("click", function(ev){
        var r = ev.target.closest("[data-rmp]"); if (!r) return;
        readP(); w.pauses.splice(+r.dataset.rmp, 1); $("#f-pauses", p).innerHTML = pausesHtml();
      });
      $("#f-addp", p).onclick = function(){
        readP(); var base = w.e || now();
        w.pauses.push({ s: base - 30 * MIN, e: base - 15 * MIN });
        $("#f-pauses", p).innerHTML = pausesHtml();
      };
      $("#f-save", p).onclick = function(){
        readP();
        var s = fromDTL($("#f-s", p).value), e = w.e ? fromDTL($("#f-e", p).value) : null;
        var os = parseNum($("#f-os", p).value), oe = w.e ? parseNum($("#f-oe", p).value) : null;
        if (!s){ setErr(p, "Algusaeg on puudu."); return; }
        if (w.e && (!e || e <= s)){ setErr(p, "Lõpp peab olema pärast algust."); return; }
        if (os == null){ setErr(p, "Alguse odomeeter on puudu."); return; }
        if (w.e && (oe == null || oe < os)){ setErr(p, "Lõpu odomeeter peab olema vähemalt alguse näit."); return; }
        var end = e || now();
        for (var i = 0; i < w.pauses.length; i++){
          var x = w.pauses[i];
          if (!x.s || (x.e && x.e <= x.s)){ setErr(p, "Kontrolli pausi " + (i + 1) + " aegu."); return; }
          if (x.s < s || (x.e || x.s) > end){ setErr(p, "Paus " + (i + 1) + " peab jääma tööpäeva sisse."); return; }
        }
        w.s = s; w.e = e; w.os = Math.round(os); w.oe = oe != null ? Math.round(oe) : null;
        w.pauses.sort(function(a, b){ return a.s - b.s; });
        put("workdays", w.id, w); closeSheet(); toast("Tööpäev muudetud");
        if (w.e) sheetReport(w.id);
      };
    });
}

function csv(rows){
  return "\ufeff" + rows.map(function(r){
    return r.map(function(v){
      if (v == null) v = ""; else if (typeof v === "number") v = String(Math.round(v * 100) / 100).replace(".", ","); else v = String(v);
      return /[;"\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    }).join(";");
  }).join("\r\n");
}
function exportCsv(kind){
  memo = {};
  var rows, name;
  if (kind === "days"){
    name = "tooaevad";
    rows = [["Kuupäev", "Nädalapäev", "Algus", "Lõpp", "Töötunnid", "Km", "Tulu €", "Kütus €", "Muud kulud €", "Rent €", "Kulud kokku €", "Tegelik teenistus €", "Tegelik €/h", "Tegelik €/km", "Esialgne"]];
    workdaysSorted().forEach(function(w){ var c = calc(w); rows.push([dmy(w.s), wdName(w.s), hm(w.s), w.e ? hm(w.e) : "", c.h, c.km, c.inc, c.fuel, c.other, c.rent, c.costs, c.net, c.netH, c.netKm, (c.rentProv || c.kmEst || !w.e) ? "jah" : "ei"]); });
  } else if (kind === "income"){
    name = "tulud";
    rows = [["Kuupäev", "Algus", "Lõpp", "Kestus h", "Allikas", "Summa €", "Odomeeter"]];
    workdaysSorted().forEach(function(w){ (w.periods || []).forEach(function(p){ var hrs = periodHours(w, p); (p.lines || []).forEach(function(l){ rows.push([dmy(p.s), hm(p.s), hm(p.e), hrs, l.src, l.amt, p.odo]); }); }); });
  } else if (kind === "fuel"){
    name = "tankimised";
    rows = [["Kuupäev", "Kell", "Kütus", "Kogus", "Ühik", "Summa €", "Hind €/ühik", "Odomeeter", "Täispaak", "Tankla"]];
    Object.values(S.fuel).sort(function(a, b){ return a.t - b.t; }).forEach(function(f){ rows.push([dmy(f.t), hm(f.t), fuelType(f), f.l, fuelUnit(fuelType(f)), f.sum, f.price || f.sum / f.l, f.odo, f.full ? "jah" : "ei", f.station || ""]); });
  } else if (kind === "expenses"){
    name = "kulud";
    rows = [["Kuupäev", "Kell", "Kategooria", "Summa €", "Makstud telefoniga", "Märkus"]];
    Object.values(S.expenses).sort(function(a, b){ return a.t - b.t; }).forEach(function(x){ rows.push([dmy(x.t), hm(x.t), x.cat, x.amt, x.cat === "Parkimine" ? (x.phone ? "jah" : "ei") : "", x.note || ""]); });
  } else {
    name = "syndmused";
    rows = [["Kuupäev", "Algus", "Lõpp", "Märgendid", "Märkus"]];
    Object.values(S.events).sort(function(a, b){ return a.date.localeCompare(b.date); }).forEach(function(e){ rows.push([e.date.split("-").reverse().join("."), e.s, e.e, (e.tags || []).join(", "), e.text]); });
  }
  downloads.save({ filename: "driver-profit-" + name + "-" + dateKey(now()) + ".csv", data: csv(rows) }).then(function(){ toast("Fail salvestatud"); }, function(e){ if (e && e.code !== "declined") toast("Faili ei saanud salvestada"); });
}

    authBusy = true; authMsg = "";
    var p = authView === "pw"
      ? sb.auth.signInWithPassword({ email: email, password: $("#ap").value })
      : sb.auth.signInWithOtp({ email: email, options: { shouldCreateUser: false, emailRedirectTo: redirect } });
    showAuth();
    p.then(function(r){
      authBusy = false;
      if (r.error){
        var m = String(r.error.message || "");
        authMsg = /invalid login/i.test(m) ? "Vale e-post või parool." : /rate|seconds|security purposes/i.test(m) ? "Liiga palju katseid. Oota natuke ja proovi uuesti." : /signups not allowed|not found|not allowed/i.test(m) ? "Selle e-postiga kontot pole." : !navigator.onLine ? "Pole internetti." : "Midagi läks valesti. Proovi uuesti.";
      } else if (authView === "link"){ authMsg = "Link saadeti aadressile " + email + ". Ava see sellel seadmel."; }
      showAuth();
    }, function(){ authBusy = false; authMsg = "Pole internetti."; showAuth(); });
  };
}
function hideAuth(){ var el = $("#auth"); el.hidden = true; el.innerHTML = ""; }
function startSession(session, fromLink){
  if (!session || !session.user) return;
  if (uid === session.user.id){ userEmail = session.user.email; return; }
  var owner = null; try { owner = localStorage.getItem(OWNER_KEY); } catch (e){}
  if (owner && owner !== session.user.id){
    // Teine kasutaja samas seadmes: ära näita eelmise andmeid
    COLS.forEach(function(c){ S[c] = {}; }); S.settings = null; outbox = [];
  }
  try { localStorage.setItem(OWNER_KEY, session.user.id); } catch (e){}
  uid = session.user.id; userEmail = session.user.email; mode = "sync";
  assets = assetsApi; sampleFn = aiApi; sampleImg = true;
  if (fromLink) needPw = true;
  hideAuth();
  if (/access_token|type=/.test(location.hash)) history.replaceState(null, "", location.pathname + location.search);
  persist(); render(); flush(); pull();
  if (fromLink) setTimeout(function(){ toast("Määra Seadetes parool"); }, 600);
}
render();
(function init(){
  downloads = downloadsApi;
  if (!sb){ mode = "local"; renderSync(); return; }
  var fromLink = /type=(magiclink|recovery|signup|invite)/.test(location.hash);
  sb.auth.onAuthStateChange(function(ev, session){
    if (ev === "SIGNED_IN" || ev === "INITIAL_SESSION" || ev === "TOKEN_REFRESHED"){ if (session) startSession(session, fromLink); }
    if (ev === "PASSWORD_RECOVERY") needPw = true;
    if (ev === "SIGNED_OUT" && uid){ clearLocal(); location.reload(); }
  });
  sb.auth.getSession().then(function(r){
    var ses = r && r.data && r.data.session;
    if (ses) startSession(ses, fromLink); else if (!uid) showAuth();
  }, function(){ if (!uid) showAuth(); });
  setInterval(function(){ if (!document.hidden && uid && Date.now() - lastPull > 120000) pull(); }, 30000);
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(function(){});
})();
})();
</script>
